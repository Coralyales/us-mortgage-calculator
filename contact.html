<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="canonical" href="https://usmortgagecalculator.com/contact.html">
    <style>

            --primary-blue: #2563eb;
            --border-color: #e2e8f0;

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f8fafc;
                --text-muted: #94a3b8;

        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-primary); line-height: 1.6; padding: 2rem 1rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border-color); }
        h1 { margin-bottom: 1rem; font-size: 2rem; }
        p { margin-bottom: 1rem; color: var(--text-muted); }

<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Have questions, feedback, or suggestions for improving our tool? We'd love to hear from you!</p>
